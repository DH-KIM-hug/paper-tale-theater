<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6B4A32">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23A93B32'/%3E%3Crect x='4' y='4' width='24' height='5' fill='%23D9A94E'/%3E%3Crect x='7' y='9' width='18' height='19' fill='%231F2A56'/%3E%3Ccircle cx='16' cy='18' r='5' fill='%23F2B366'/%3E%3C/svg%3E">
<title>종이 동화극장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Sunflower:wght@500;700&display=swap">
<link rel="stylesheet" href="home.css">
</head>
<body>
<!-- 공용 SVG: 종이 조각 그림자 필터 + 태그 아이콘 (글을 못 읽는 아이가 그림으로 알아본다) -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="pp" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.1" flood-color="#2E241C" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 전체: 선반 위 상자 넷 -->
  <symbol id="i-all" viewBox="0 0 32 32"><rect x="5" y="5" width="9.5" height="9.5" rx="1.5" fill="#A93B32"/><rect x="17.5" y="5" width="9.5" height="9.5" rx="1.5" fill="#3F6B4F"/><rect x="5" y="17.5" width="9.5" height="9.5" rx="1.5" fill="#1F2A56"/><rect x="17.5" y="17.5" width="9.5" height="9.5" rx="1.5" fill="#D9A94E"/></symbol>
  <!-- 이솝: 여우 얼굴 (동물 우화) -->
  <symbol id="i-aesop" viewBox="0 0 32 32"><path d="M5 7 L12 12 L20 12 L27 7 L26 18 Q16 30 6 18Z" fill="#E8703A"/><path d="M10 20 Q16 28 22 20 L16 25Z" fill="#F6ECD8"/><circle cx="12" cy="17" r="1.8" fill="#2E241C"/><circle cx="20" cy="17" r="1.8" fill="#2E241C"/><circle cx="16" cy="24" r="1.6" fill="#2E241C"/></symbol>
  <!-- 한국 전래: 초가집 -->
  <symbol id="i-korean" viewBox="0 0 32 32"><rect x="7" y="16" width="18" height="11" fill="#F6ECD8"/><rect x="14" y="19" width="5" height="8" fill="#6B4A32"/><path d="M3 18 Q16 3 29 18Z" fill="#D9A94E"/><rect x="3" y="27" width="26" height="2.5" fill="#6B4A32"/></symbol>
  <!-- 외국 전래: 깃발 달린 성탑 -->
  <symbol id="i-world" viewBox="0 0 32 32"><rect x="15.5" y="2" width="1.6" height="7" fill="#6B4A32"/><path d="M17 2 h7 l-2 2.5 2 2.5 h-7z" fill="#A93B32"/><path d="M8 10 h4 v3 h2.5 v-3 h3 v3 h2.5 v-3 h4 V29 H8Z" fill="#1F2A56"/><rect x="13.5" y="20" width="5" height="9" rx="2.5" fill="#D9A94E"/></symbol>
  <!-- 수 세기: 알 셋 -->
  <symbol id="i-count" viewBox="0 0 32 32"><circle cx="7" cy="20" r="4.2" fill="#A93B32"/><circle cx="16" cy="16" r="4.2" fill="#D9A94E"/><circle cx="25" cy="12" r="4.2" fill="#3F6B4F"/><rect x="3" y="26" width="26" height="2.4" fill="#6B4A32"/></symbol>
  <!-- 크기 비교: 큰 원과 작은 원 -->
  <symbol id="i-size" viewBox="0 0 32 32"><circle cx="12" cy="17" r="9.5" fill="#E8703A"/><circle cx="26" cy="23" r="4" fill="#1F2A56"/><rect x="2" y="27" width="28" height="2.4" fill="#6B4A32"/></symbol>
  <!-- 순서: 계단 -->
  <symbol id="i-order" viewBox="0 0 32 32"><rect x="3" y="21" width="8" height="8" fill="#D9A94E"/><rect x="12" y="14" width="8" height="15" fill="#E8703A"/><rect x="21" y="6" width="8" height="23" fill="#A93B32"/></symbol>
  <!-- 분류: 두 바구니에 나눠 담기 -->
  <symbol id="i-sort" viewBox="0 0 32 32"><circle cx="6" cy="13" r="2.8" fill="#D9A94E"/><circle cx="11" cy="11" r="2.8" fill="#D9A94E"/><circle cx="21" cy="11" r="2.8" fill="#A93B32"/><circle cx="26" cy="13" r="2.8" fill="#A93B32"/><path d="M2 16 h12 l-2 11 h-8z" fill="#6B4A32"/><path d="M18 16 h12 l-2 11 h-8z" fill="#6B4A32"/></symbol>
  <!-- 차이 찾기: 돋보기 -->
  <symbol id="i-spot" viewBox="0 0 32 32"><path d="M19 20 L27 28" stroke="#6B4A32" stroke-width="4.5" stroke-linecap="round"/><circle cx="13" cy="13" r="9" fill="#1F2A56"/><circle cx="13" cy="13" r="6" fill="#F6ECD8"/><circle cx="11" cy="11" r="1.8" fill="#D9A94E"/></symbol>
  <!-- 소리 듣기: 종 -->
  <symbol id="i-sound" viewBox="0 0 32 32"><rect x="14.5" y="3" width="3" height="4" fill="#6B4A32"/><path d="M8 24 Q9 7 16 7 Q23 7 24 24Z" fill="#D9A94E"/><rect x="5" y="23" width="22" height="3" rx="1.5" fill="#A93B32"/><circle cx="16" cy="28" r="2.4" fill="#6B4A32"/></symbol>
  <!-- 모양 맞추기: 동그라미·세모·네모 -->
  <symbol id="i-shape" viewBox="0 0 32 32"><circle cx="9" cy="10" r="6" fill="#A93B32"/><path d="M23 3.5 L29.5 15 H16.5Z" fill="#3F6B4F"/><rect x="10" y="18" width="12" height="11" fill="#1F2A56"/></symbol>
  <!-- 날씨·계절: 구름 뒤 해 -->
  <symbol id="i-season" viewBox="0 0 32 32"><circle cx="12" cy="12" r="7.5" fill="#F2B366"/><path d="M9 25 a5 5 0 0 1 3 -9 a7 7 0 0 1 13 1 a4.2 4.2 0 0 1 1 8z" fill="#8BA6C4"/></symbol>
  <!-- 마음·배려: 하트 -->
  <symbol id="i-heart" viewBox="0 0 32 32"><path d="M16 28 C4 20 2 14 4 9.5 C6 5 12 4.5 16 9.5 C20 4.5 26 5 28 9.5 C30 14 28 20 16 28Z" fill="#A93B32"/></symbol>
  <!-- 보호자 톱니 -->
  <symbol id="i-gear" viewBox="0 0 32 32"><path d="M13.5 3 h5 l.8 3.6 3 1.3 3.1 -2 3.5 3.5 -2 3.1 1.3 3 3.6 .8 v5 l-3.6 .8 -1.3 3 2 3.1 -3.5 3.5 -3.1 -2 -3 1.3 -.8 3.6 h-5 l-.8 -3.6 -3 -1.3 -3.1 2 -3.5 -3.5 2 -3.1 -1.3 -3 -3.6 -.8 v-5 l3.6 -.8 1.3 -3 -2 -3.1 3.5 -3.5 3.1 2 3 -1.3z" fill="currentColor"/><circle cx="16" cy="16" r="4.5" fill="#6B4A32"/></symbol>
</svg>

<div id="home">
  <aside class="board" aria-label="동화 고르기">
    <header class="brand">
      <h1 class="logo"><span>종이</span> 동화극장</h1>
      <button id="parentBtn" class="gear" type="button" aria-label="보호자 메뉴: 3초 동안 누르세요">
        <svg class="gear-ic" aria-hidden="true"><use href="#i-gear"/></svg>
        <svg class="gear-ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19"/></svg>
      </button>
    </header>

    <section class="tagrow" data-row="origin">
      <h2 class="row-tab">이야기</h2>
      <div class="chips" role="group" aria-label="이야기 종류"></div>
    </section>
    <section class="tagrow" data-row="skill">
      <h2 class="row-tab">배우는 것</h2>
      <div class="chips" role="group" aria-label="배우는 것"></div>
    </section>
  </aside>

  <main class="shelf" id="shelf">
    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden>
      <p>이 조합의 이야기는 아직 없어요</p>
      <button type="button" class="ticket" id="emptyReset">전체 보기</button>
    </div>
  </main>
</div>

<!-- 짧은 안내 쪽지 (보호자 톱니를 짧게 눌렀을 때) -->
<div id="hint" class="hint" hidden>보호자 메뉴는 3초 동안 꾹 누르세요</div>

<!-- 보호자 메뉴 -->
<div id="parentPanel" class="parent" hidden role="dialog" aria-modal="true" aria-labelledby="parentTitle">
  <div class="sheet">
    <h2 id="parentTitle">보호자 메뉴</h2>
    <p class="how">위 줄에서 <b>이야기 종류</b>, 아래 줄에서 <b>배우는 것</b>을 고릅니다.
      같은 줄에서 여러 개를 고르면 그중 <b>하나라도</b> 맞는 이야기, 두 줄을 함께 고르면 <b>둘 다</b> 맞는 이야기가 나옵니다.
      커튼이 닫힌 이야기는 아직 만들고 있는 중이에요.</p>
    <label class="toggle"><input type="checkbox" id="optSpeak"> 태그와 제목을 소리로 읽어 주기</label>
    <div class="sheet-btns">
      <button type="button" class="ticket alt" id="optReset">고른 태그 지우기</button>
      <button type="button" class="ticket" id="parentClose">닫기</button>
    </div>
  </div>
</div>

<!-- audio.js 의 Narrator 가 쓰는 말풍선 (홈에서는 작은 이름표로 보인다) -->
<div id="bubble" hidden><p id="bubbleText"></p></div>

<script src="audio.js"></script>
<script src="tales/catalog.js"></script>
<script src="home.js"></script>
</body>
</html>
