<link rel="icon" type="image/png" sizes="192x192" href="../../assets/icons/favicon-192.png?v=moon1">

<!-- 녹음: 기본 ElevenLabs(eleven_v4, 한국어·영어), ?voice=tc 이면 Typecast. 합창은 chorus.js(TC) 뒤에 chorus_el.js(EL) -->
<script src="narration.js"></script>
<script>try { if (localStorage.getItem('lang') === 'en') document.write('<script src="narration_en.js"><\/script>'); } catch (e) { /* 영어 자료 없이 한국어로 */ }</script>
<script>try { const q = new URLSearchParams(location.search).get('voice'); if (q === 'tc') localStorage.setItem('voice', 'tc'); else if (q === 'el') localStorage.removeItem('voice'); if (localStorage.getItem('voice') !== 'tc') document.write('<script src="narration_el.js"><\/script>' + (localStorage.getItem('lang') === 'en' ? '<script src="narration_el_en.js"><\/script>' : '')); } catch (e) { /* ElevenLabs 없이 Typecast 로 */ }</script>
<script src="chorus.js"></script>
<script>try { if (localStorage.getItem('voice') !== 'tc') document.write('<script src="chorus_el.js"><\/script>'); } catch (e) { /* ElevenLabs 합창 없이 Typecast 로 */ }</script>
