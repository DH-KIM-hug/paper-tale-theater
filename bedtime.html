<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1F2A56">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=moon1">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png?v=moon1">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=moon1">
<title>잠자리 이어 듣기</title>
<style>
/* 잠자리 이어 듣기 플레이어 (docs/BEDTIME_PLAN.md §4-2): 어두운 남색 종이 한 장 위에 표지 구멍 하나. 소품·장식 없음 */
@font-face{font-family:'Pretendard Local';font-style:normal;font-weight:45 920;font-display:swap;src:url(assets/fonts/PretendardVariable.woff2) format('woff2')}
:root {
  /* 토큰 이름은 홈(home.css, UI_REDESIGN §3)과 같다 */
  --night: #1F2A56;          /* 밤 종이 한 장 */
  --night-deep: #172044;     /* 구멍 속 */
  --paper: #F5EFE9;          /* 단추 종이(크림) */
  --ink-on-night: #F5EFE9;   /* 밤 종이 위 글자 */
  --ink-on-night-2: #C9CFE0; /* 밤 종이 위 보조 글자 */
  --reward: #C98A5B;
  --warm-dark: #2E241C;
  --font: 'Pretendard Local', 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink-on-night); font-family: var(--font); overflow: hidden; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-user-select: none; user-select: none; }
button, a { font: inherit; color: inherit; }
#stage { position: absolute; inset: 0; padding: max(env(safe-area-inset-top), 12px) 20px 20px; display: grid; gap: 14px 28px;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top meta" "cover txt" "ctl ctl"; align-items: center; }
#homeBtn { grid-area: top; justify-self: start; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--paper); color: var(--night); display: grid; place-items: center; cursor: pointer; text-decoration: none;
  box-shadow: 0 1px 2px rgba(46, 36, 28, .35), 0 6px 14px -4px rgba(46, 36, 28, .5); }
#homeBtn svg { width: 28px; height: 28px; }
#meta { grid-area: meta; justify-self: end; text-align: right; font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--ink-on-night-2); }
#coverWrap { grid-area: cover; min-height: 0; min-width: 0; display: grid; place-items: center; }
#hole { position: relative; width: min(100%, calc((100vh - 230px) * 16 / 9)); aspect-ratio: 16 / 9; max-height: 100%; border-radius: 22px; overflow: hidden; background: var(--night-deep);
  box-shadow: inset 0 3px 10px rgba(0, 0, 0, .45); }
#hole::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 4px 10px rgba(46, 36, 28, .55), inset 0 -1px 0 rgba(245, 239, 233, .35); }
.cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s ease; }
.cv.on { opacity: 1; }
#txt { grid-area: txt; min-width: 0; align-self: center; display: flex; flex-direction: column; gap: 10px; }
#ttl { margin: 0; font-size: clamp(24px, 3.2vw, 38px); font-weight: 800; letter-spacing: .08em; line-height: 1.25; }
#card { margin: 0; min-height: 1.4em; font-size: clamp(17px, 2vw, 24px); font-weight: 600; letter-spacing: .08em; color: var(--ink-on-night-2); }
#bubble { margin: 6px 0 0; min-height: 3.6em; font-size: clamp(18px, 2.1vw, 26px); font-weight: 500; line-height: 1.55; letter-spacing: .03em; color: var(--ink-on-night); }
#bubble[hidden] { display: block; visibility: hidden; }
#next { margin: 0; font-size: 14px; letter-spacing: .06em; color: var(--ink-on-night-2); }
#ctl { grid-area: ctl; display: flex; justify-content: center; gap: 36px; }
.cbtn { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--paper); color: var(--night); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 1px 2px rgba(46, 36, 28, .35), 0 8px 18px -4px rgba(46, 36, 28, .55); }
.cbtn:active, #homeBtn:active { transform: translateY(1px); box-shadow: inset 2px 3px 6px rgba(46, 36, 28, .35); }
.cbtn svg, .cbtn img { width: 44px; height: 44px; display: block; object-fit: contain; -webkit-user-drag: none; }
.cbtn img.play { translate: 6% 0; }   /* 세모는 오른쪽으로 살짝 민다 */
.cbtn:focus-visible, #homeBtn:focus-visible, #startBtn:focus-visible { outline: 3px solid var(--reward); outline-offset: 4px; }
#startBtn { display: none; min-width: 237px; min-height: 80px; padding: 0 36px; border: 0; border-radius: 40px; background: var(--paper); color: var(--night); font-size: 24px; font-weight: 800; letter-spacing: .1em; cursor: pointer;
  box-shadow: 0 1px 2px rgba(46, 36, 28, .35), 0 8px 18px -4px rgba(46, 36, 28, .55); }
#plan { margin: 0; font-size: 15px; line-height: 1.5; letter-spacing: .04em; color: var(--ink-on-night-2); display: none; }
#empty { display: none; margin: 0; font-size: 20px; line-height: 1.5; letter-spacing: .05em; }
#end { grid-area: txt; display: none; flex-direction: column; gap: 14px; align-self: center; font-size: 22px; font-weight: 600; letter-spacing: .1em; }
@keyframes hint { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
#startBtn.hint { animation: hint 1.1s ease-in-out infinite; }
/* 상태별 보이기 */
body[data-state="start"] #ctl, body[data-state="start"] #card, body[data-state="start"] #bubble, body[data-state="start"] #next { display: none; }
body[data-state="start"] #startBtn { display: inline-grid; place-items: center; align-self: flex-start; }
body[data-state="start"] #plan { display: block; }
body[data-state="empty"] #ctl, body[data-state="empty"] #card, body[data-state="empty"] #bubble, body[data-state="empty"] #next, body[data-state="empty"] #hole { display: none; }
body[data-state="empty"] #empty { display: block; }
body[data-state="end"] #ctl, body[data-state="end"] #card, body[data-state="end"] #bubble, body[data-state="end"] #next, body[data-state="end"] #ttl, body[data-state="end"] #meta { display: none; }
body[data-state="end"] #end { display: flex; }
/* 60초 무입력 → 어두운 종이 덮개가 3초에 걸쳐 내려온다. 톡 하면 걷힌다(덮개 톡은 단추가 아니다) */
#veil { position: fixed; inset: 0; z-index: 9; background: var(--warm-dark); opacity: 0; pointer-events: none; transition: opacity 3s ease; }
body.dim #veil { opacity: .85; pointer-events: auto; }
body.dim[data-state="end"] #veil { opacity: .96; }
/* 세로 */
@media (max-aspect-ratio: 1/1) {
  #stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "top" "cover" "txt" "ctl"; gap: 14px; }
  #meta { position: absolute; top: max(env(safe-area-inset-top), 12px); right: 20px; margin-top: 18px; max-width: calc(100% - 100px); }
  #hole { width: min(100%, calc((100vh - 400px) * 3 / 4), 560px); aspect-ratio: 3 / 4; }
  #txt { align-self: start; }
  #bubble { min-height: 4.6em; }
}
/* 낮은 가로(아이폰) */
@media (orientation: landscape) and (max-height: 520px) {
  #stage { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top meta" "cover txt"; padding-bottom: 8px; }
  #hole { width: min(100%, calc((100vh - 80px) * 16 / 9)); }
  #ctl { position: absolute; right: 20px; bottom: 8px; gap: 24px; }
  .cbtn { width: 80px; height: 80px; }
  #txt { padding-bottom: 96px; }
  #bubble { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { .cv, #veil { transition: none; } #startBtn.hint { animation: none; } }
</style>
</head>
<body data-state="start">
<main id="stage">
  <a id="homeBtn" href="index.html#night" aria-label="집"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 2 14h3v11h7v-7h4v7h7V14h3Z" fill="currentColor"/></svg></a>
  <div id="meta"></div>
  <div id="coverWrap"><div id="hole"><img class="cv on" id="cvA" alt="" draggable="false"><img class="cv" id="cvB" alt="" draggable="false"></div></div>
  <section id="txt">
    <h1 id="ttl"></h1>
    <p id="plan"></p>
    <button type="button" id="startBtn">듣기 시작</button>
    <p id="card"></p>
    <p id="bubble" hidden><span id="bubbleText"></span></p>
    <p id="next"></p>
    <p id="empty"></p>
  </section>
  <div id="end"><span id="endT">다 들었어요</span></div>
  <div id="ctl">
    <button type="button" class="cbtn" id="pauseBtn" aria-label="멈춤"></button>
    <button type="button" class="cbtn" id="nextBtn" aria-label="건너뛰기"><img src="assets/ui/ic_skip.webp" alt="" aria-hidden="true" draggable="false"></button>
  </div>
</main>
<div id="veil" aria-hidden="true"></div>
<script>/* 영어 자료(읽기 녹음)가 들어오는 자리 — 홈 제목 녹음 파일이 NARRATION_CLIPS(_EN) 를 만든다 */</script>

<script src="tales/catalog.js?v=20261028animal1"></script>
<script src="entitlements.js?v=20261028pz1"></script>
<script src="home_narration_el.js?v=20261029tone1"></script>
<script src="bedtime.js?v=20261028ui3"></script>
</body>
</html>
