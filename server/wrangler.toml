# 종이 동화극장 연결 서버. 배포 절차는 DEPLOY.md(사용자용 순서), 구성은 README.md 참고.
# 배포 주소는 앱 쪽 tools/app/server.env 의 PAPERTALE_API_BASE 에 넣는다.
name = "paper-tale-sync"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "cd3ea6ffa1b39e3226315118b70c63ee"

[[kv_namespaces]]
binding = "ACCOUNTS"
id = "03ea520c5f0b4f7b8c67636361e4e42e"
preview_id = "3265edb7ac2242fbb33d314d876da93a"

[vars]
APPLE_BUNDLE_ID = "com.papertale.theater"
PLAY_PACKAGE_NAME = "com.papertale.theater"
# 웹 공개 주소(CORS 허용). 실제 주소로 바꾼다. 여러 개면 쉼표로 구분.
WEB_ORIGINS = "https://dh-kim-hug.github.io"

# 비밀값은 wrangler.toml 에 쓰지 않는다:
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_JSON
#   wrangler secret put APPLE_ROOT_CA_G3_PEM   (선택: src/apple_root.js 에 진짜 인증서가 이미 있다, 지문 63:34:3A…91:79 확인 2026-11-06)
