<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>동화 화면 단계 검증기</title>
<style>
  :root { color-scheme: light; --bg:#F5EFE9; --ink:#1F2A56; --mute:#6B6F86; --card:#FFFFFF; --acc:#A93B32; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, sans-serif; padding: env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px); }
  header { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 0; }
  select, button { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid #d9d2c8; background:#fff; color:var(--ink); }
  button:disabled { opacity:.4; }
  .seg { display:flex; gap:4px; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  #count { color:var(--mute); font-size:13px; }
  #wrap { display:flex; justify-content:center; }
  #frame { border:0; background:#fff; border-radius:14px; box-shadow:0 2px 0 #e4dcd0; max-width:100%; }
  #info { background:var(--card); border-radius:14px; padding:14px 16px; margin-top:12px; box-shadow:0 2px 0 #e4dcd0; }
  #kind { display:inline-block; font-size:12px; font-weight:700; color:#fff; background:var(--ink); border-radius:8px; padding:1px 8px; }
  #line { font-size:20px; font-weight:700; margin:8px 0; line-height:1.45; word-break:keep-all; }
  #file { color:var(--mute); font-size:12px; word-break:break-all; }
  #hint { color:var(--mute); font-size:12px; margin-top:8px; }
  nav { display:flex; gap:8px; margin-top:12px; }
  nav button { flex:1; padding:14px; font-size:16px; }
  html, body { height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #list { flex:1; min-height:0; margin-top:12px; overflow:auto; background:#fff; border-radius:12px; padding:6px 10px; }
  #list div { padding:5px 4px; border-bottom:1px solid #f0ebe3; font-size:13px; }
  #list div.on { color:var(--acc); font-weight:700; }
  #list .tag { font-size:11px; color:#fff; background:var(--mute); border-radius:6px; padding:0 6px; margin-right:4px; }
  #list .tag.scene { background:var(--acc); }
</style>
</head>
<body>
<header>
  <select id="tale" aria-label="동화"></select>
  <div class="seg">
    <button id="ko" aria-pressed="true">한국어</button>
    <button id="en" aria-pressed="false">English</button>
  </div>
  <div class="seg">
    <button id="portrait" aria-pressed="true">세로</button>
    <button id="land" aria-pressed="false">가로</button>
  </div>
  <div class="seg"><button id="read" aria-pressed="false" title="읽어 주기 모드(?read=1): 조작 없이 그림책처럼 읽는다. 대본이 있는 동화만">읽어 주기</button></div>
  <button id="restart">처음부터</button>
  <span id="count"></span>
</header>

<div id="wrap"><iframe id="frame" title="동화 화면" allow="autoplay"></iframe></div>

<div id="info">
  <span id="kind">-</span>
  <div id="line">동화를 불러오는 중…</div>
  <div id="file"></div>
  <div id="hint">「다음」 = 이 단계 음성을 멈추고 다음 행동으로. 톡을 기다리는 단계는 「다음」이 대신 눌러 줍니다. 「이전」 = 처음부터 다시 달려 앞 단계 상태로 맞춥니다(건너뛴 부분은 소리 없음, 조금 걸림).</div>
</div>

<nav>
  <button id="prev">← 이전</button>
  <button id="replay">다시 듣기</button>
  <button id="next">다음 →</button>
</nav>

<div id="list"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KIND = { say: '대사', tap: '톡', mash: '톡톡톡', choose: '고르기', swipe: '쓱', hold: '꾹', free: '자유 톡' };
  let M = {}, lang = 'ko', taleId = '', steps = [], cur = -1, want = -1, pendingScene = null, port = true, readMode = false;

  function load(skip, skipto) {
    const f = $('#frame');
    try { localStorage.setItem('lang', lang); } catch (e) {}
    $('#kind').textContent = '…'; $('#line').textContent = '불러오는 중…'; $('#file').textContent = '';
    cur = -1; want = skip;
    f.onload = () => {
      // 시작 화면의 시작 단추를 눌러 준다(같은 출처). 막혀 있으면 직접 한 번 눌러야 한다.
      setTimeout(() => { try { const b = f.contentDocument.querySelector('#startBtn'); if (b) b.click(); } catch (e) {} }, 400);
    };
    f.src = `../../tales/${taleId}/index.html?verify=1&skip=${skip}` + (readMode ? '&read=1' : '') + (skipto ? `&skipto=${encodeURIComponent(skipto)}` : '') + `&t=${Date.now()}`;
  }

  function sizeFrame() {
    const f = $('#frame'), w = Math.min(innerWidth - 32, port ? 420 : 900);
    f.style.width = w + 'px'; f.style.height = Math.round(port ? Math.min(w * 1.55, innerHeight * .42) : Math.min(w * .62, innerHeight * .45)) + 'px';
    const h = document.querySelector('#hint'); if (h) h.hidden = innerHeight < 950;   /* 작은 화면에서는 설명을 숨겨 목록 자리를 남긴다 */
  }

  function render() {
    const st = steps[cur];
    $('#count').textContent = steps.length ? `${cur + 1} / ${steps.length}+` : '';
    if (st) {
      $('#kind').textContent = KIND[st.kind] || st.kind;
      $('#line').textContent = st.kind === 'say' ? st.text : '(아이가 톡 하는 자리)';
      $('#file').textContent = st.file || (st.kind === 'say' ? '음성 파일 없음(브라우저 음성)' : '');
    }
    $('#prev').disabled = cur <= 0;
    const list = $('#list'); list.innerHTML = '';
    const src = readMode ? ((M[taleId] || {})[lang === 'en' ? 'read_en' : 'read_ko'] || []) : ((M[taleId] || {})[lang === 'en' ? 'en' : 'ko'] || []);
    const all = src.map(x => x.text), keys = src.map(x => x.key || x.text);
    const curText = st && st.kind === 'say' ? st.text : null;
    const seen = new Set(steps.filter(Boolean).filter(x => x.kind === 'say').map(x => x.text));
    all.forEach((t, i) => {
      const d = document.createElement('div');
      if (t === curText || keys[i] === curText) d.className = 'on';
      else if (seen.has(t) || seen.has(keys[i])) d.style.color = 'var(--mute)';
      d.textContent = (i + 1) + '. ' + t;
      d.style.cursor = 'pointer';
      d.title = '눌러서 이 대사 장면으로 바로 가기';
      d.onclick = () => { steps = []; load(0, keys[i]); };
      list.appendChild(d);
    });
    const on = list.querySelector('.on'); if (on) list.scrollTop = on.offsetTop - list.offsetTop - list.clientHeight / 2;   /* 목록 안에서만 스크롤(페이지는 그대로) */
  }
  const esc = x => String(x).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  addEventListener('message', e => {
    if (e.source !== $('#frame').contentWindow) return;
    const m = e.data || {};
    if (m.type === 'scene') { pendingScene = m.label || ''; return; }
    if (m.type !== 'step') return;
    const old = steps[m.n] || {};
    steps[m.n] = Object.assign({}, old, m, { scene: pendingScene !== null ? pendingScene : old.scene });
    if (steps[m.n].scene === undefined) delete steps[m.n].scene;
    pendingScene = null;
    if (m.skipped) return; // 건너뛰는 중에는 화면 갱신을 미룬다
    cur = m.n; render();
  });

  const next = () => { if (cur < 0) return; try { $('#frame').contentWindow.postMessage({ type: 'go' }, '*'); } catch (e) {} };
  const prev = () => { if (cur > 0) load(cur - 1); };
  const replay = () => { try { $('#frame').contentWindow.postMessage({ type: 'replay' }, '*'); } catch (e) {} };

  function setTale() { steps = []; pendingScene = null; render(); load(0); }
  function setLang(l) { lang = l; $('#ko').setAttribute('aria-pressed', l === 'ko'); $('#en').setAttribute('aria-pressed', l === 'en'); setTale(); }
  function setPort(v) { port = v; $('#portrait').setAttribute('aria-pressed', v); $('#land').setAttribute('aria-pressed', !v); sizeFrame(); }

  function init() {
    const sel = $('#tale');
    Object.keys(M).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
    const q = new URLSearchParams(location.search).get('tale');
    taleId = sel.value = (q && M[q]) ? q : (M.red_car ? 'red_car' : Object.keys(M)[0] || '');
    if (new URLSearchParams(location.search).get('lang') === 'en') { lang = 'en'; $('#ko').setAttribute('aria-pressed', false); $('#en').setAttribute('aria-pressed', true); }
    sel.onchange = () => { taleId = sel.value; setTale(); };
    $('#ko').onclick = () => setLang('ko'); $('#en').onclick = () => setLang('en');
    $('#portrait').onclick = () => setPort(true); $('#land').onclick = () => setPort(false);
    $('#restart').onclick = setTale;
    const setRead = v => { readMode = v; $('#read').setAttribute('aria-pressed', v); setTale(); };
    if (new URLSearchParams(location.search).get('read') === '1') { readMode = true; $('#read').setAttribute('aria-pressed', true); }
    $('#read').onclick = () => setRead(!readMode);
    $('#next').onclick = next; $('#prev').onclick = prev; $('#replay').onclick = replay;
    document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') prev(); });
    addEventListener('resize', sizeFrame);
    sizeFrame(); setTale();
  }

  fetch('manifest.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).then(d => { M = d; init(); })
    .catch(() => { $('#line').textContent = 'manifest.json 을 읽지 못했습니다(node tools/dev/make_manifest.js 로 생성)'; });
})();
</script>
</body>
</html>
